<section class="products-container">

  <canvas #productsCanvas class="products-bg"></canvas>

  <div class="products-content">

    <h2 class="products-title">
      PRODUTOS
    </h2>

    <div class="carousel-wrapper">

      <!-- BOTÃO ESQUERDA -->
      <button
        class="carousel-btn prev-btn"
        aria-label="Anterior"
        (click)="scrollPrev()"
      >
        <span class="arrow-icon">‹</span>
      </button>

      <!-- TRACK -->
      <div
        #track
        class="products-track"
        (scroll)="onScroll()"
      >

        @for (product of displayProducts; track $index) {

          <div class="product-card">

            <div class="image-box">

              <img
                [src]="product.image"
                [alt]="product.name"
                draggable="false"
              />

            </div>

            <div class="card-footer">

              <div class="info-meta">

                <span class="product-name">
                  {{ product.name }}
                </span>

                <span class="product-brand">
                  {{ product.brand }}
                </span>

              </div>

              <div class="badge-action">

                <span class="badge-text">
                  {{ product.badge }}
                </span>

                <div class="arrow-circle">
                  ➔
                </div>

              </div>

            </div>

          </div>
        }

      </div>

      <!-- BOTÃO DIREITA -->
      <button
        class="carousel-btn next-btn"
        aria-label="Próximo"
        (click)="scrollNext()"
      >
        <span class="arrow-icon">›</span>
      </button>

    </div>

  </div>

</section>
